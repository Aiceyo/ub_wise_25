<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />

<style>
:root {
  --bg-color: #0b0d10;
  --sidebar-bg: #050505;
  --text-main: #e0e6ed;
  --accent-blue: #2980b9;
  --accent-cyan: #00f2fe;
  --accent-gradient: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
  --font-main: 'Inter', sans-serif;
  --nav-height: 70px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  height: 100%; width: 100%;
  background: var(--bg-color);
  color: var(--text-main);
  font-family: var(--font-main);
  font-size: 18px;
  overflow: hidden; /* App-Container steuert Scroll */
}

#app { display: flex; height: 100vh; width: 100vw; }

/* ---------------- Sidebar (Desktop) ---------------- */
#sidebar {
  width: 320px;
  background: var(--sidebar-bg);
  border-right: 1px solid #222;
  display: flex; flex-direction: column;
  padding: 2rem 1.5rem;
  overflow-y: auto;
  flex-shrink: 0;
  z-index: 100;
}

#sidebar h2 {
  font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;
  color: #666; margin: 0 0 2rem 0;
}

#toc button {
  background: none; border: none;
  color: #8899a6;
  display: block; width: 100%;
  text-align: left;
  padding: 0.8rem 1rem;
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 8px;
  margin-bottom: 4px;
}
#toc button:hover { background: rgba(255,255,255,0.05); color: #fff; }
#toc button.active {
  background: linear-gradient(90deg, rgba(0, 242, 254, 0.1), transparent);
  color: var(--accent-cyan);
  font-weight: 600;
  border-left: 3px solid var(--accent-cyan);
}

/* ---------------- Content Area ---------------- */
#content {
  flex: 1;
  position: relative;
  overflow-y: auto; /* Natives Scrollen! */
  scroll-behavior: smooth;
  padding: 0;
}

#content-inner {
  max-width: 1600px; /* Schön breit für Desktop */
  margin: 0 auto;
  padding: 4rem 6rem 150px 6rem;
  min-height: 100vh;
}

/* ---------------- Typography ---------------- */
h1 {
  font-size: 3.5rem; margin-top: 0; margin-bottom: 0.5em;
  background: var(--accent-gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  display: inline-block;
}
h2 {
  font-size: 2.5rem; color: var(--accent-cyan);
  border-bottom: 1px solid #333; padding-bottom: 0.5em; margin: 2em 0 1em 0;
}
h3 { font-size: 1.8rem; color: #fff; margin-bottom: 1rem; }

p {
  line-height: 1.8; margin-bottom: 2em; font-size: 1.25rem;
  max-width: 1200px; color: #cbd5e1;
}

.subtitle { font-size: 1.5rem; font-weight: 600; color: #fff; margin-bottom: 0.5rem; display:block; }
.underlined-subtitle {
  border-bottom: 3px solid var(--accent-blue); padding-bottom: 0.5rem; margin-bottom: 1.5rem;
  display: block; font-size: 1.5rem; font-weight: bold; color: var(--accent-cyan);
}

/* Highlights */
strong { color: var(--accent-cyan); font-weight: 600; }
.highlight-marker { border-bottom: 2px solid var(--accent-cyan); color: #fff; }
.superscript {
  color: var(--accent-cyan); font-weight: bold; cursor: pointer;
  font-size: 0.8em; vertical-align: super; transition: all 0.2s;
}
.superscript:hover { text-shadow: 0 0 10px var(--accent-cyan); }

/* Tooltips */
.tooltip { border-bottom: 1px dotted var(--accent-cyan); cursor: help; color: var(--accent-cyan); position: relative; }
.tooltip::after {
  content: attr(data-tooltip); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
  background: #111; border: 1px solid var(--accent-blue); color: #fff; padding: 1em;
  border-radius: 6px; font-size: 0.9rem; width: max-content; max-width: 300px;
  pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 100;
}
.tooltip:hover::after { opacity: 1; }

/* ---------------- Components (Fading) ---------------- */
/* Wir nutzen CSS für den Fade-In Effekt beim Scrollen, aber OHNE Scroll-Jacking */
.build-element {
  opacity: 0; transform: translateY(30px);
  transition: opacity 0.8s ease-out, transform 0.8s ease-out;
  margin-bottom: 3rem;
}
.build-element.visible { opacity: 1; transform: translateY(0); }

/* Boxen */
.question-box, .answer-box, .info-box, .paragraph-with-icon {
  padding: 2.5rem; border-radius: 12px; margin: 3rem 0; max-width: 1400px;
}
.question-box {
  background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), transparent);
  border-left: 6px solid var(--accent-cyan);
  display: flex; gap: 2rem; align-items: center;
}
.question-box img { width: 80px; }

.answer-box {
  background: rgba(41, 128, 185, 0.1); border-left: 6px solid var(--accent-blue);

.info-box {
  background: #151920; border: 1px solid #333; position: relative; overflow: hidden;

.info-box::before { content: ""; position: absolute; top:0; left:0; width: 6px; height: 100%; background: var(--accent-gradient); }

/* Grafiken */
.graphic-block { margin: 5em 0; text-align: center; }
.graphic-block img {
  max-width: 100%; height: auto; max-height: 85vh;
  border-radius: 12px; border: 1px solid #333;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);

.image-row-split { display: flex; justify-content: center; gap: 3rem; flex-wrap: wrap; margin: 4rem 0; }
.image-row-split img { max-width: 48%; border-radius: 12px; }

/* Navigation Buttons im Text */
.nav-buttons {
  display: flex; justify-content: space-between; margin-top: 6rem; padding-top: 2rem; border-top: 1px solid #333;
}
.btn-nav {
  background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue);
  padding: 1rem 2rem; font-size: 1.1rem; cursor: pointer; border-radius: 50px; transition: all 0.3s;
}
.btn-nav:hover { background: var(--accent-blue); color: #fff; box-shadow: 0 0 20px rgba(41, 128, 185, 0.4); }
.btn-next { margin-left: auto; background: var(--accent-gradient); color: #000; border: none; font-weight: bold; }
.btn-next:hover { transform: scale(1.05); color: #000; }

/* Grid Kap 7 */
#kapitel7 .grid-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; }
#kapitel7 article:nth-of-type(1), #kapitel7 article:nth-of-type(6) { grid-column: 1 / -1; }
#kapitel7 article:nth-of-type(5) { grid-column: 2; grid-row: 2 / span 4; }

/* Tabellen */
table { width: 100%; border-collapse: collapse; margin-top: 2em; font-size: 1.1rem; }
th, td { padding: 1.2em; text-align: left; border: 1px solid #333; }
th { background: #1a2634; color: var(--accent-cyan); text-transform: uppercase; }

/* ---------------- Mobile ---------------- */
#mobile-nav {
  display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
  background: rgba(10,10,10,0.95); border-top: 1px solid #333; z-index: 1000;

#mobile-menu-overlay {

#mobile-menu-overlay.open { transform: translateY(0); }

@media(max-width: 1100px) {
  #sidebar { display: none; }
  #mobile-nav { display: flex; }
  #content-inner { width: 100%; padding: 2rem 1.5rem 100px 1.5rem; }

  .image-row-split img { max-width: 100%; }
}
</style>

/* ---------------- LOGIK (Scroll Fix) ---------------- */
const toc = document.getElementById("toc");
const mobileToc = document.getElementById("mobile-toc");
const contentInner = document.getElementById("content-inner");
const contentContainer = document.getElementById("content");
let currentChapter = 0;

/* Init */
function init() {
  chapters.forEach((ch, i) => {
    // TOC Desktop
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.textContent = ch.title;
    btn.onclick = () => jumpToChapter(i);
    li.appendChild(btn);
    toc.appendChild(li);

    // TOC Mobile
    const liM = li.cloneNode(true);
    liM.querySelector("button").onclick = () => { jumpToChapter(i); toggleMobileMenu(false); };
    mobileToc.appendChild(liM);
  });

  loadChapter(0);

  // Observer für Einflieg-Effekte
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting) entry.target.classList.add("visible");
    });
  }, { threshold: 0.1 });

  // Funktion um Observer neu zu binden
  window.attachObserver = () => {
    document.querySelectorAll('.build-element').forEach(el => observer.observe(el));
  };
}

function loadChapter(idx, position = "top") {
  currentChapter = idx;
  const ch = chapters[idx];
  document.getElementById("chapter-title-display").textContent = ch.title;

  // Active TOC State
  document.querySelectorAll("#toc button").forEach((b, i) => b.classList.toggle("active", i === idx));

  // Content bauen
  let html = "";

  // Spezial-Layout für Kap 7
  if(ch.id === "kapitel7") html += '<div class="grid-inner">';

  ch.elements.forEach(el => {
    html += `<article class="build-element">`;
    if(el.type === "text") {
      el.paragraphs.forEach(p => {
        let txt = p.replace(/^#+\s*/, "").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

        // Link Logik für [x]
        txt = txt.replace(/\[(\d+)\]/g, (m,n) => `<span class="superscript" onclick="jumpToChapter(${chapters.length-1})">[${n}]</span>`);

        if(p.startsWith("####")) html += `<p class="subtitle tight">${txt}</p>`;
        else if(p.startsWith("##")) html += `<h2>${txt}</h2>`;
        else html += `<p>${txt}</p>`;
      });
    } else {
      html += el.html;
    }
    html += `</article>`;
  });

  if(ch.id === "kapitel7") html += '</div>';

  // Navigation Buttons unten
  html += `<div class="nav-buttons">`;
  if(idx > 0) html += `<button class="btn-nav" onclick="prevChapter()">← Zurück</button>`;
  else html += `<div></div>`;

  if(idx < chapters.length - 1) html += `<button class="btn-nav btn-next" onclick="nextChapter()">Weiter →</button>`;
  html += `</div>`;

  contentInner.innerHTML = html;

  // Observer aktivieren
  window.attachObserver();

  // Scroll Position setzen
  if(position === "bottom") {
    // Kurz warten bis Rendering fertig
    setTimeout(() => {
        const lastEl = contentInner.lastElementChild;
        lastEl.scrollIntoView({ behavior: "auto" });
    }, 10);
  } else {
    contentContainer.scrollTop = 0;
  }
}

function nextChapter() {
  if(currentChapter < chapters.length - 1) {
    loadChapter(currentChapter + 1, "top");
  }
}

function prevChapter() {
  if(currentChapter > 0) {
    // "Vorheriger Zustand": Wir springen ans Ende des vorherigen Kapitels
    loadChapter(currentChapter - 1, "bottom");
  }
}

function jumpToChapter(idx) {
  loadChapter(idx, "top");
}

function toggleMobileMenu(force) {
  const el = document.getElementById("mobile-menu-overlay");
  if(typeof force === "boolean") {
    if(force) el.classList.add("open"); else el.classList.remove("open");
  } else {
    el.classList.toggle("open");
  }
}

init();

</script>
